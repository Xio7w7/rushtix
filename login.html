<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RushTix | Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- ===== Barra de navegación ===== -->
  <header class="navbar">
    <a href="index.html" class="logo">RUSH <span>TIX.</span></a>

    <nav class="menu">
      <a href="index.html">Eventos</a>
      <a href="#">Mis boletos</a>
      <a href="#">Ayuda</a>
    </nav>

    <div class="acciones">
      <a href="login.html" class="btn btn-borde">Iniciar sesión</a>
      <a href="#" class="btn btn-rojo">Registrarme</a>
    </div>
  </header>

  <!-- ===== Formulario de inicio de sesión (centrado) ===== -->
  <main class="contenedor-login">

    <div class="encabezado">
      <p class="etiqueta">Mi cuenta</p>
      <h1>Iniciar sesión</h1>
      <p class="subtitulo">Entrá con tu correo para ver tus boletos y comprar más rápido.</p>
    </div>

    <form class="formulario" action="#">
      <label for="correo">Correo</label>
      <input type="email" id="correo" placeholder="mariana@correo.com" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" placeholder="••••••••" required>

      <button type="submit" class="btn-ingresar">Ingresar</button>

      <a href="#" class="olvide">Olvidé mi contraseña</a>

      <a href="#" class="btn-crear">Crear cuenta</a>
    </form>

  </main>

</body>
</html>
